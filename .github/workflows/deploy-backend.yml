# Build the API image in CI, then have the droplet pull and restart.
#
# The image is built here rather than on the server: a small droplet building
# a Node image while also serving traffic risks running out of memory, and a
# failed build would take the running API down with it.

name: Deploy backend

# Opt-in for now: deploy by hand first (see market-backend/DEPLOY.md), then
# enable the push trigger once the server layout is proven.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/fetchmart-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./market-backend
          push: true
          # Tag with the commit SHA so a rollback is just re-pinning a tag.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fetchmart/market-backend
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export API_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull api
            # Migrations run before the new container serves traffic, using the
            # freshly pulled image so schema and code always move together.
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --no-build api
            docker image prune -f
