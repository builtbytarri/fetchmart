# Production stack — designed to sit ALONGSIDE an existing Caddy on the same box.
#
# Postgres, Redis and the API all run here. Postgres moved in from Neon after
# the free tier's compute quota ran out; the database is now this box's
# responsibility, including backups (see deploy/backup-db.sh).
#
# Redis is not optional: BullMQ drives the store-accept timeout and the
# rider-offer expiry. Without it a paid order sits forever with no auto-cancel
# and no refund.
#
# Note there is no `ports:` on the api service. Caddy already owns 80/443 and
# reaches this container by name over the shared `web` network. Publishing 3000
# on the host would let anyone bypass TLS by hitting the IP directly.
#
# The database has no `ports:` either, and sits only on `internal`. It is
# reachable from the api container as `db:5432` and from nowhere else.

services:
  api:
    build: .
    image: fetchmart-api:latest
    container_name: fetchmart-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Redis and Postgres live on the internal network under their service
      # names. These override whatever localhost/Neon values .env carries.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://fetchmart:${POSTGRES_PASSWORD}@db:5432/fetchmart
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
      - web
    healthcheck:
      # Liveness only. /health (readiness) also queries Postgres and must not be
      # polled this often — that is exactly what exhausted the Neon quota.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: fetchmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fetchmart
      POSTGRES_DB: fetchmart
      # Set in .env on the host, next to this file. Never committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      # Deliberately not on `web` — nothing outside this stack should reach it.
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fetchmart -d fetchmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fetchmart-redis
    restart: unless-stopped
    # Append-only persistence so queued jobs survive a restart or redeploy.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      # Deliberately not on `web` — nothing outside this stack should reach Redis.
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  internal:
  web:
    # Created once by hand and shared with the Caddy container.
    external: true
    name: web

volumes:
  redis-data:
  pg-data:
